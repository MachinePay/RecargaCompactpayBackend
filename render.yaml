# Blueprint da Render: cria o backend e o Postgres juntos.
# Render > New > Blueprint > escolha este repositorio.
services:
  - type: web
    name: compactpay-recarga-api
    runtime: python
    # free dorme sem uso e derruba o WebSocket do carregador. Para testar serve;
    # em producao troque para starter.
    plan: free
    # Uma instancia so: as conexoes OCPP ficam em memoria.
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_VERSION
        value: 1.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: compactpay-recarga-db
          property: connectionString
      # A Render gera a chave; ela fica em Environment no painel da Render.
      - key: ADMIN_API_KEY
        generateValue: true
      # URL do site na Vercel, ex.: https://compactpay-recarga.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # true so na bancada: com true o Pix do motorista sai simulado (recarga de graca).
      - key: MP_SIMULADO
        value: "false"
      - key: MP_ACCESS_TOKEN
        sync: false
      # Geocoding API do Google: CEP + numero no ponto certo do mapa (opcional).
      - key: GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: compactpay-recarga-db
    plan: free
    databaseName: carregador
    user: carregador
